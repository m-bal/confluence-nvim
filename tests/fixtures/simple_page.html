<h1>Getting Started</h1>
<p>Welcome to the project documentation.</p>

<h2>Prerequisites</h2>
<ul>
  <li>Neovim 0.10+</li>
  <li>Rust toolchain</li>
  <li>Git</li>
</ul>

<h2>Installation</h2>
<p>Follow these steps to get started:</p>
<ol>
  <li>Clone the repository</li>
  <li>Run <code>cargo build</code></li>
  <li>Configure your editor</li>
</ol>

<p>For more information, see the <a href="/wiki/advanced">Advanced Guide</a>.</p>
